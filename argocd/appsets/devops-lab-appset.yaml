apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-lab
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: guestbook
            path: apps/guestbook
            namespace: apps
          - name: podinfo
            path: apps/podinfo
            namespace: apps
          - name: load-generator
            path: apps/load-generator
            namespace: apps
          - name: kyverno-policies
            path: kyverno/policies
            namespace: kyverno
          - name: prometheus-rules
            path: prometheus/rules
            namespace: monitoring
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: devops-lab
        generator: appset
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devops-lab
      source:
        repoURL: https://github.com/simonjday/devops-lab-repo
        targetRevision: HEAD
        path: "{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      ignoreDifferences:
        - group: kyverno.io
          kind: ClusterPolicy
          jqPathExpressions:
            - .spec.admission
            - .spec.emitWarning
            - .spec.rules[].skipBackgroundRequests
            - .spec.rules[].validate.allowExistingViolations
            - .spec.rules[].validate.foreach[].deny.conditions.any[].message
            - .spec.rules[] | select(.name | startswith("autogen-"))
            - .status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
