apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-rules
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: devops-lab
spec:
  project: devops-lab
  source:
    repoURL: https://github.com/YOUR_ORG/devops-lab-repo  # UPDATE THIS
    targetRevision: HEAD
    path: prometheus/rules
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
