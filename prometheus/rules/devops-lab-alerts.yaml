# PrometheusRule — alerting rules for the devops-lab cluster
# These rules drive the alerting demo and light up Grafana dashboards
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-lab-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    # ── Application Health ───────────────────────────────────────────────────
    - name: app.health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"apps|apps-staging"}[10m]) * 60 > 3
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 3 times in 10 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace=~"apps|apps-staging"}
            != kube_deployment_status_available_replicas{namespace=~"apps|apps-staging"}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replicas."

        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (
              max by (namespace, pod) (kube_pod_status_phase{namespace=~"apps|apps-staging", phase=~"Pending|Unknown"}) * on(namespace, pod)
              group_left(owner_kind) kube_pod_owner{owner_kind!="Job"}
            ) > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for 5 minutes."

    # ── Resource Pressure ────────────────────────────────────────────────────
    - name: resource.pressure
      interval: 60s
      rules:
        - alert: ContainerHighCpuUsage
          expr: |
            (sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=~"apps|apps-staging", container!=""}[5m])) /
             sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu", namespace=~"apps|apps-staging"})) > 0.9
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Container {{ $labels.container }} CPU > 90%"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is using {{ printf \"%.0f\" (mul $value 100) }}% of its CPU limit."

        - alert: ContainerHighMemoryUsage
          expr: |
            (container_memory_working_set_bytes{namespace=~"apps|apps-staging", container!=""} /
             kube_pod_container_resource_limits{resource="memory", namespace=~"apps|apps-staging"}) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Container {{ $labels.container }} memory > 85%"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is using {{ printf \"%.0f\" (mul $value 100) }}% of its memory limit."

        - alert: NodeHighMemoryPressure
          expr: |
            (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Node {{ $labels.instance }} memory < 10% free"
            description: "Node {{ $labels.instance }} has less than 10% memory available."

    # ── Kyverno Policy Violations ────────────────────────────────────────────
    - name: kyverno.policy
      interval: 60s
      rules:
        - alert: KyvernoPolicyViolation
          expr: |
            increase(kyverno_policy_results_total{rule_result="fail"}[5m]) > 0
          for: 0m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Kyverno policy violation: {{ $labels.policy_name }}"
            description: "Policy {{ $labels.policy_name }} rule {{ $labels.rule_name }} had {{ $value }} failures in the last 5 minutes."

        - alert: KyvernoHighViolationRate
          expr: |
            sum(rate(kyverno_policy_results_total{rule_result="fail"}[10m])) > 1
          for: 5m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "High rate of Kyverno policy violations"
            description: "More than 1 policy violation per second over the last 10 minutes."

    # ── ArgoCD Sync Health ────────────────────────────────────────────────────
    - name: argocd.sync
      interval: 60s
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is out of sync"
            description: "ArgoCD application {{ $labels.name }} in project {{ $labels.project }} has been out of sync for 10 minutes."

        - alert: ArgoCDAppUnhealthy
          expr: |
            argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is unhealthy"
            description: "ArgoCD application {{ $labels.name }} health status is {{ $labels.health_status }}."
