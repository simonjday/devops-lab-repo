apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers running as root (UID 0) have elevated privileges and can
      cause significant damage if compromised.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-runasnonroot
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps, apps-staging, policy-test]
      validate:
        message: "Containers must not run as root. Set securityContext.runAsNonRoot: true and runAsUser > 0."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
                  =(runAsUser): ">0"
