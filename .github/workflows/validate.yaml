name: Validate Kubernetes Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Job 1: kubeconform schema validation ─────────────────────────────────
  validate:
    name: Validate with kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          # Pin to a specific version — "latest" redirects can break on runners
          KUBECONFORM_VERSION="v0.6.7"
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate core Kubernetes manifests
        # Validate plain k8s resources only — skip CRDs (ArgoCD, Kyverno,
        # Prometheus) which require separate schema sources.
        # --ignore-missing-schemas means unknown CRD kinds are skipped rather
        # than failing the job.
        run: |
          find . \
            -name '*.yaml' \
            -not -path './.github/*' \
            -not -path './argocd/*' \
            -not -path './kyverno/*' \
            -not -path './prometheus/*' \
          | kubeconform \
              -schema-location default \
              -ignore-missing-schemas \
              -summary \
              -verbose

      - name: Validate ArgoCD manifests
        # ArgoCD CRDs validated with the official schema from the argocd repo
        run: |
          find ./argocd -name '*.yaml' \
          | kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/argoproj/argo-cd/master/manifests/crds/{{.ResourceKind}}-crd.yaml' \
              -ignore-missing-schemas \
              -summary \
              -verbose

  # ── Job 2: Kyverno CLI policy test ───────────────────────────────────────
  kyverno-test:
    name: Test Kyverno policies (kyverno-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          # Use the official Kyverno GitHub Action installer to avoid
          # binary naming issues (asset is 'kyverno' not inside a tarball)
          KYVERNO_VERSION="v1.13.4"
          curl -sSLo /tmp/kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_linux_x86_64.tar.gz"
          tar xf /tmp/kyverno.tar.gz -C /tmp
          # The binary inside the tarball is named 'kyverno'
          sudo mv /tmp/kyverno /usr/local/bin/kyverno 2>/dev/null || \
          sudo mv /tmp/kyverno-cli /usr/local/bin/kyverno 2>/dev/null || \
          (ls /tmp && exit 1)
          chmod +x /usr/local/bin/kyverno
          kyverno version

      - name: Apply policies against compliant pod
        # Should produce PASS for all policies
        run: |
          kyverno apply kyverno/policies/ \
            --resource apps/policy-test-suite/compliant-pod.yaml \
            --detailed-results

      - name: Apply policies against violating pods
        # Violations are expected — use || true so the job doesn't fail
        # The point is to verify the CLI runs and policies parse correctly
        run: |
          kyverno apply kyverno/policies/ \
            --resource apps/policy-test-suite/missing-limits.yaml \
            --resource apps/policy-test-suite/privileged-pod.yaml \
            --resource apps/policy-test-suite/root-user.yaml \
            --detailed-results || true

  # ── Job 3: YAML lint ─────────────────────────────────────────────────────
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        # Relaxed rules — we care about parse errors not style
        run: |
          yamllint -d '{
            extends: relaxed,
            rules: {
              line-length: {max: 200},
              truthy: disable,
              comments: disable,
              braces: disable,
              brackets: disable
            }
          }' \
          $(find . -name '*.yaml' -not -path './.github/*') \
          && echo "All YAML files are valid"

  # ── Job 4: Changed files summary (PRs only) ───────────────────────────────
  diff:
    name: Changed YAML files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git diff across branches

      - name: List changed YAML files
        run: |
          echo "Changed YAML files in this PR:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
          | grep '\.yaml$' \
          | sed 's/^/  /' \
          || echo "  (no YAML files changed)"
